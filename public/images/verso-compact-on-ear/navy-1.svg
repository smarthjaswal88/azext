<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900" role="img">
  <rect width="900" height="900" fill="#f6f7f7"/>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#465168"/>
      <stop offset="0.55" stop-color="#28354f"/>
      <stop offset="1" stop-color="#202a3f"/>
    </linearGradient>
    <linearGradient id="bodyV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#465168"/>
      <stop offset="1" stop-color="#202a3f"/>
    </linearGradient>
    <linearGradient id="sleeve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#202a3f"/>
      <stop offset="1" stop-color="#28354f"/>
    </linearGradient>
    <radialGradient id="cup" cx="0.36" cy="0.30" r="0.85">
      <stop offset="0" stop-color="#465168"/>
      <stop offset="0.6" stop-color="#28354f"/>
      <stop offset="1" stop-color="#192131"/>
    </radialGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000000" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="450" cy="760" rx="250" ry="34" fill="url(#shadow)"/>
  <g>
    <path d="M 250 400 C 250 150, 650 150, 650 400"
          fill="none" stroke="#192131" stroke-width="30" stroke-linecap="round"/>
    <path d="M 250 400 C 250 150, 650 150, 650 400"
          fill="none" stroke="#465168" stroke-width="9"
          stroke-linecap="round" opacity="0.55"/>
    <path d="M 276 330 C 290 205, 610 205, 624 330"
          fill="none" stroke="#101520" stroke-width="16" stroke-linecap="round" opacity="0.85"/>
    <!-- yokes -->
    <rect x="237" y="352" width="26" height="86" rx="13" fill="#101520"/>
    <rect x="637" y="352" width="26" height="86" rx="13" fill="#101520"/>
    <!-- cups -->
    <rect x="190.0" y="418" width="120.0" height="150.4" rx="53" fill="url(#cup)" stroke="#1e273a" stroke-width="2"/>
    <rect x="590.0" y="418" width="120.0" height="150.4" rx="53" fill="url(#cup)" stroke="#1e273a" stroke-width="2"/>
    <!-- ear pads -->
    <rect x="207.0" y="437" width="86.0" height="112.4"
          rx="38" fill="#192131"/>
    <rect x="607.0" y="437" width="86.0" height="112.4"
          rx="38" fill="#192131"/>
    <ellipse cx="250" cy="512" rx="29" ry="39" fill="#101520" opacity="0.7"/>
    <ellipse cx="650" cy="512" rx="29" ry="39" fill="#101520" opacity="0.7"/>
    <!-- highlight -->
    <path d="M 210.0 470 q 14 -34 46 -40" stroke="#465168" stroke-width="9"
          fill="none" stroke-linecap="round" opacity="0.55"/>
  </g>
