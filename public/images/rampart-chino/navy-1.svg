    </radialGradient>
  </defs>
  <ellipse cx="450" cy="770" rx="190" ry="26" fill="url(#shadow)"/>
  <g>
    <path d="M 316 186 L 584 186 L 600 336 L 578 742 L 474 742 L 450 404 L 426 742 L 322 742 L 300 336 Z"
